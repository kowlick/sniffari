<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sniffari — Heel</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-mode="solo">
    <header>
      <h1><canvas id="wordmark" aria-label="Sniffari" role="img"></canvas></h1>
      <div class="status">
        <span id="phase">Heel</span>
        <span id="round"></span>
      </div>
      <div class="right">
        <button id="mute" class="icon" title="Sound on/off">🔊</button>
        <a id="home" class="icon" href="/" title="Back to the menu">✕</a>
      </div>
    </header>

    <main class="solo">
      <div class="boardwrap">
        <canvas id="board"></canvas>
        <div id="banner" class="banner"></div>
      </div>

      <aside>
        <section>
          <h2>Queue — tap to drop the next one</h2>
          <div id="queue" class="queue"></div>
          <p id="solo-hint" class="hint"></p>
        </section>
        <section>
          <!-- The whole game is one button. It is deliberately enormous: on a phone this is
               the only thing you touch while the dog is moving. -->
          <button id="drop" class="primary drop">Drop</button>
          <div class="row solo-row">
            <button id="retry">Retry</button>
            <button id="next" class="hidden">Next level</button>
          </div>
        </section>
        <section>
          <h2>Level</h2>
          <div class="row solo-row">
            <button id="prev-level">◀</button>
            <input id="level-input" type="number" min="1" max="9999" />
            <button id="go-level">Go</button>
          </div>
          <p id="solo-meta" class="hint"></p>
          <button id="share" class="claim hidden">Copy my solution</button>
          <!-- A development aid: the intended answer, drawn on the board. Lives behind its
               own URL so it is not sitting in the level payload. -->
          <button id="reveal" class="claim">Show the solution</button>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/solo.js"></script>
  </body>
</html>
